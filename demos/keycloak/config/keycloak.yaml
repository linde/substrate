apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  ports:
  - name: https
    port: 8443
    targetPort: 8443
  - name: http
    port: 8080
    targetPort: 8080
  - name: management
    port: 9000
    targetPort: 9000
  selector:
    app: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.0.7
        args:
        - "start-dev"
        - "--import-realm"
        env:
        - name: KEYCLOAK_ADMIN
          value: "admin"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "admin"
        - name: KC_HOSTNAME
          value: "https://keycloak.keycloak.svc.cluster.local:8443"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
          value: "true"
        - name: KC_HTTPS_CERTIFICATE_FILE
          value: "/etc/x509/https/tls.crt"
        - name: KC_HTTPS_CERTIFICATE_KEY_FILE
          value: "/etc/x509/https/tls.key"
        - name: KC_HEALTH_ENABLED
          value: "true"
        - name: KC_METRICS_ENABLED
          value: "true"
        - name: KC_HTTP_ENABLED
          value: "true"
        ports:
        - name: https
          containerPort: 8443
        - name: http
          containerPort: 8080
        - name: management
          containerPort: 9000
        startupProbe:
          httpGet:
            scheme: HTTPS
            path: /health/ready
            port: 9000
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            scheme: HTTPS
            path: /health/live
            port: 9000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            scheme: HTTPS
            path: /health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: realm-volume
          mountPath: /opt/keycloak/data/import
          readOnly: true
        - name: tls-volume
          mountPath: /etc/x509/https
          readOnly: true
      volumes:
      - name: realm-volume
        configMap:
          name: keycloak-realm
      - name: tls-volume
        secret:
          secretName: keycloak-tls
