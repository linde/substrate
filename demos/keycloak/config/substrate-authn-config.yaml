# This illustrates the merged configuration for ConfigMap ate-api-authentication
# in the ate-system namespace.
#
# Note: For real clusters, run config/patch-substrate-authn.sh which automatically
# preserves your cluster's existing Kubernetes issuer and injects the Keycloak
# CA certificate into this ConfigMap.

apiVersion: v1
kind: ConfigMap
metadata:
  name: ate-api-authentication
  namespace: ate-system
data:
  authentication.yaml: |
    actorIdentityJWTProvider: kubernetes
    jwtProviders:
    - name: kubernetes
      issuer: https://kubernetes.default.svc.cluster.local
      audiences:
      - api.ate-system.svc
      certificateAuthorityFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
      discoveryTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
    - name: keycloak
      issuer: https://keycloak.keycloak.svc.cluster.local:8443/realms/substrate
      audiences:
      - substrate
      certificateAuthorityFile: /etc/ateapi/authentication/keycloak-ca.crt
